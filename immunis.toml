  "brain",
  "brain-cli",
  "brain-runner",
  "deontic-engine",
  "django-action-registry",
  "django-booking",
  "django-discussions",
  "django-entitlements",
  "django-prio",
  "django-sb-registry",
  "django-support",
  "launchcast",
  "relsvg",
  "secret",
  "tulisalama-tools",
  "uikit",
]

# The files telamon generated into this repository, with the digest of each
# as generated. The sensor reads it so a hand-edited generated file is a
# fact the auditor can see, not a surprise on the next `tl generate`.
generated_manifest = ".telamon-generated.json"

