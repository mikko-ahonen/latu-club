# Policy for the immunis sensor (https://github.com/mikko-ahonen/immunis).
# Generated by telamon — edit projects.yaml, not this file.
#
# The sensor is public and generic; this file is the part that is ours. It
# carries only what the sensor cannot infer about this repository.

# Distributions served from our own package registry rather than pypi.org:
# every project that publishes there, plus any names listed under
# `defaults.private_distributions` in projects.yaml. Pinning one of these in
# a file resolved against the public index is the dependency-confusion hole
# the two-step install exists to close.
