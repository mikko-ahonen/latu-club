
# Telamon-generated docker-compose.yml for latu-club

services:
  web:
    stdin_open: true
    tty: true
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: hugo server --bind 0.0.0.0 --port 8020 --buildDrafts --disableFastRender
    ports:
      - "8020:8020"
    volumes:
      - ./:/src
      # shares (projects.yaml) — a named fleet share. The host side is the
      # same path on EVERY node (/srv/shares/<name>): on the owning node the
      # devbox role binds it to the real directory, elsewhere it cifs-mounts
      # it from the owner. That is what lets one generated compose file work
      # on any node, which a raw host path could not.
      - /srv/shares/transcribe:/data/transcribe

  claude:
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      target: claude
      # Forward SSH at build time so the toolbelt layer (shared include
      # _shared/private-cli.j2) can pip install tulisalama-tools over git+ssh
      # from the tulisalama Gitea. Scoped key when provisioned, operator
      # id_ed25519 as the pre-migration fallback. Passphraseless.
      ssh:
        - default=${HOME}/.ssh/id_ed25519
    volumes:
      - ./:/src
      # shares (projects.yaml) — a named fleet share. The host side is the
      # same path on EVERY node (/srv/shares/<name>): on the owning node the
      # devbox role binds it to the real directory, elsewhere it cifs-mounts
      # it from the owner. That is what lets one generated compose file work
      # on any node, which a raw host path could not.
      - /srv/shares/transcribe:/data/transcribe
      - ../../.workspaces/latu-club:/workspaces
      - ~/.ssh/id_ed25519:/home/dev/.ssh/id_ed25519:ro
      - ~/.ssh/known_hosts:/home/dev/.ssh/known_hosts:ro
      - ~/.ssh/config:/home/dev/.ssh/config:ro
    environment:
      - CLAUDE_CONFIG_DIR=/workspaces/claude
      - CLAUDE_CODE_DISABLE_TERMINAL_TITLE=1
      - APP_URL=http://web:8020
      - GIT_AUTHOR_NAME="Mikko Ahonen"
      - GIT_AUTHOR_EMAIL="mikko@jauzo.com"
      - GIT_COMMITTER_NAME="Mikko Ahonen"
      - GIT_COMMITTER_EMAIL="mikko@jauzo.com"
    env_file:
      - .env.claude