<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  {{ hugo.Generator }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  {{- with .Site.Params.plausible_src }}
  <script defer data-domain="{{ $.Site.Params.plausible_domain }}" src="{{ . }}"></script>
  {{- end }}
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="border-bottom py-3">
    <div class="container">
      <a class="fs-5 fw-semibold text-decoration-none"
         href="https://helsinginlatu.fi/jasenille/talviuinti-rastilassa/">Hel Latu &bull; Talviuinti &bull; Rastila</a>
    </div>
  </header>
  <main class="container flex-grow-1 py-4">
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
